<div class="donations-page">

  <div class="page-header">

    <h1>Donations</h1>

    <p>
      Donations submitted through the website.
    </p>

  </div>


  <!-- Loading -->

  <div *ngIf="loading" class="message">
    Loading donations...
  </div>


  <!-- Error -->

  <div *ngIf="errorMessage" class="error-message">

    <p>{{ errorMessage }}</p>

    <button (click)="loadDonations()">
      Try Again
    </button>

  </div>


  <!-- Donations -->

  <div class="donations-list" *ngIf="!loading && !errorMessage">

    <div class="donation-item" *ngFor="let donation of donations">

      <div class="donation-info">

        <h3>{{ donation.name }}</h3>

        <p>
          <strong>Email:</strong>
          {{ donation.email }}
        </p>

        <p>
          <strong>Amount:</strong>
          ₹{{ donation.amount }}
        </p>

        <div class="donation-actions">

          <!-- Pending / Not Accepted -->
          <button type="button" class="accept-btn" *ngIf="donation.status !== 'accepted'"
            (click)="acceptDonation(donation.id)">
            Accept
          </button>

          <!-- Accepted -->
          <button type="button" class="accepted-btn" *ngIf="donation.status === 'accepted'"
            (click)="rejectDonation(donation.id)">
            Accepted ✓
          </button>

          <!-- Delete -->
          <button type="button" class="delete-btn" (click)="deleteDonation(donation.id)">
            Delete
          </button>

        </div>

        <!-- No donations -->

        <p *ngIf="donations.length === 0" class="message">
          No donations found.
        </p>

      </div>

    </div>
