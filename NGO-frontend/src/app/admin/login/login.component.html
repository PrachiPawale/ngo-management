<div class="login-container">

  <h1>Admin Login</h1>

  <form (ngSubmit)="login()">

    <div>
      <label>Username</label>

      <input
        type="username"
        name="username"
        [(ngModel)]="username"
        placeholder="Enter username"
      >
    </div>

    <div>
      <label>Password</label>

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"
      >
    </div>

    <button
      type="submit"
      [disabled]="loading"
    >
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

  </form>

  <p *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

</div>
